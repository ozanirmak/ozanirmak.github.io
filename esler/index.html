<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Esler — Şifreli P2P Paylaşım</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Manrope:wght@400;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B1426;--card:#13203A;--card2:#1A2B4C;--or:#FF7A1A;--cy:#22D3EE;--tx:#E8EEF7;--mut:#8A9BB8;--r:14px;--err:#FF5470;--ok:#3DDC97}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:15px/1.5 Manrope,system-ui,sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
h1,h2,h3{font-family:Archivo,system-ui,sans-serif;font-weight:800}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
button{font:600 15px Manrope,system-ui,sans-serif;min-height:44px;border-radius:var(--r);border:1px solid #22D3EE33;background:var(--card2);color:var(--tx);padding:0 16px;cursor:pointer;transition:background .2s,transform .15s,box-shadow .2s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
button:hover{box-shadow:0 0 0 1px #22D3EE66,0 0 14px #22D3EE22}
button:active{transform:scale(.97)}
button.pri{background:var(--or);border-color:var(--or);color:#1a0d00}
button.danger{background:#3a1520;border-color:#FF547055;color:#ffb3c0}
button.on{background:var(--cy);color:#04202a;border-color:var(--cy)}
button:disabled{opacity:.45;cursor:not-allowed}
input,textarea{font:15px Manrope,system-ui,sans-serif;background:#0d1830;color:var(--tx);border:1px solid #22D3EE33;border-radius:var(--r);padding:12px;width:100%;min-height:44px;outline:none;transition:border .2s}
input:focus,textarea:focus{border-color:var(--cy)}
textarea.code{font-family:"JetBrains Mono",monospace;font-size:12px;height:110px;resize:vertical;word-break:break-all}
.card{background:var(--card);border-radius:var(--r);padding:20px;border:1px solid #22D3EE1f;box-shadow:0 0 24px #22D3EE0d}
.screen{display:none;min-height:100%;padding:20px;max-width:560px;margin:0 auto;flex-direction:column;gap:16px;justify-content:center}
.screen.act{display:flex}
.logo{display:flex;align-items:center;gap:10px;font-size:28px}
.logo svg{width:40px;height:40px}
.mut{color:var(--mut)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:5px;border-radius:3px;background:#22D3EE22;transition:background .25s}
.steps i.d{background:var(--or)}
.lbl{font-size:13px;color:var(--mut);margin-bottom:6px;display:block}
.msg{font-size:14px;padding:10px 12px;border-radius:10px;display:none}
.msg.e{display:block;background:#3a1520;color:#ffb3c0}
.msg.i{display:block;background:#0f2d3a;color:#aef0ff}
footer{text-align:center;color:var(--mut);font-size:12px;padding:12px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* session */
#s-sess{max-width:none;padding:0;justify-content:flex-start;height:100dvh;gap:0}
.top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card);border-bottom:1px solid #22D3EE1f}
.dot{width:10px;height:10px;border-radius:50%;background:var(--mut);box-shadow:0 0 8px currentColor}
.dot.ok{background:var(--ok);color:var(--ok)}.dot.w{background:var(--or);color:var(--or)}.dot.x{background:var(--err);color:var(--err)}
#safety{margin-left:auto;font-size:18px;letter-spacing:4px;cursor:help}
.main{flex:1;display:flex;flex-direction:column;min-height:0}
#vid{position:relative;background:#050a14;display:none;aspect-ratio:9/12;max-height:45dvh}
#vid.show{display:block}
#rv{width:100%;height:100%;object-fit:contain;background:#050a14}
#lv{position:absolute;right:10px;bottom:10px;width:28%;max-width:160px;border-radius:10px;border:2px solid var(--or);background:#000;display:none}
#lv.show{display:block}
#fs{position:absolute;top:8px;right:8px;min-height:36px;padding:0 10px;background:#0b142699}
#chat{flex:1;display:flex;flex-direction:column;min-height:0}
#log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.b{max-width:80%;padding:10px 14px;border-radius:16px;word-wrap:break-word;white-space:pre-wrap;animation:pop .2s ease}
.b.me{align-self:flex-end;background:var(--or);color:#1a0d00;border-bottom-right-radius:4px}
.b.th{align-self:flex-start;background:var(--card2);border-bottom-left-radius:4px}
.b.sys{align-self:center;background:none;color:var(--mut);font-size:13px;text-align:center}
.b img{max-width:100%;max-height:260px;border-radius:10px;display:block;margin-bottom:6px}
.b a{color:inherit;font-weight:600}
.prog{height:6px;background:#0005;border-radius:3px;overflow:hidden;margin:6px 0}
.prog i{display:block;height:100%;background:var(--cy);width:0;transition:width .15s}
.b.me .prog i{background:#1a0d00}
#typing{font-size:12px;color:var(--mut);padding:0 14px;height:18px}
.bar{display:flex;gap:8px;padding:10px;background:var(--card);border-top:1px solid #22D3EE1f;align-items:center;flex-wrap:wrap}
.bar input[type=text]{flex:1 1 160px}
.bar button{padding:0 12px}
#drop{position:fixed;inset:0;background:#0B1426dd;border:3px dashed var(--or);display:none;align-items:center;justify-content:center;font:800 24px Archivo;z-index:9}
#drop.show{display:flex}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mut)}
.chk input{width:auto;min-height:0}
@media(min-width:900px){
 .main{flex-direction:row}
 #vid{aspect-ratio:auto;max-height:none;flex:1.4}
 #chat{flex:1;border-left:1px solid #22D3EE1f}
}
@keyframes pop{from{transform:scale(.95);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg style="display:none"><defs>
<symbol id="i-img" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></symbol>

</defs></svg>

<!-- 1. Giriş -->
<section class="screen act" id="s-home">
 <div class="logo"><svg viewBox="0 0 40 40"><circle cx="13" cy="20" r="9" fill="none" stroke="#FF7A1A" stroke-width="3"/><circle cx="27" cy="20" r="9" fill="none" stroke="#22D3EE" stroke-width="3"/></svg><h1>Esler</h1></div>
 <div class="card" style="display:flex;flex-direction:column;gap:12px">
  <button class="pri" id="b-create">Oda oluştur</button>
  <button id="b-join">Odaya katıl</button>
 </div>

<!-- 2. Kurulum -->
<section class="screen" id="s-setup">
 <h2 id="st-title">Oda oluştur</h2>
 <div class="steps"><i></i><i></i><i></i></div>
 <div class="card" style="display:flex;flex-direction:column;gap:14px" id="st-body"></div>
 <div class="msg" id="st-msg"></div>
 <button id="b-back">Geri</button>
</section>

<!-- 3. Oturum -->
<section class="screen" id="s-sess">
 <div class="top">
  <span class="dot w" id="dot"></span><b id="stat">Bağlanıyor</b>
  <span id="safety" class="mono" title="Güvenlik kodu: karşı taraftakiyle aynı olmalı. Sesli karşılaştırın."></span>
 </div>
 <div class="main">
  <div id="vid"><video id="rv" autoplay playsinline></video><video id="lv" autoplay playsinline muted></video>
   <button id="tap" hidden style="position:absolute;inset:0;margin:auto;width:120px">Oynat</button><button id="fs" title="Tam ekran"><svg class="i"><use href="#i-full"/></svg></button></div>
  <div id="chat"><div id="log"></div><div id="typing"></div></div>
 </div>
 <div class="bar">
  <input type="text" id="tx" placeholder="Mesaj yaz…" autocomplete="off">
  <button class="pri" id="b-send" title="Gönder"><svg class="i"><use href="#i-send"/></svg></button>
  <button id="b-img" title="Dosya gönder"><svg class="i"><use href="#i-img"/></svg></button>
  <button id="b-cam" title="Kamera"><svg class="i"><use href="#i-cam"/></svg></button>
  <button id="b-mic" title="Mikrofon" disabled><svg class="i"><use href="#i-mic"/></svg></button>
  <button id="b-flip" title="Kamerayı çevir" disabled><svg class="i"><use href="#i-flip"/></svg></button>
  <button id="b-scr" title="Ekran paylaş"><svg class="i"><use href="#i-scr"/></svg></button>
  <button class="danger" id="b-end" title="Bağlantıyı bitir"><svg class="i"><use href="#i-end"/></svg></button>
  <input type="file" id="file" multiple hidden>
 </div>
</section>
<div id="drop">Bırak</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const enc = new TextEncoder(), dec = new TextDecoder();

/* ---------- signal: 3 haneli kodla buluşma (PeerJS ücretsiz aracı sunucu) ----------
   Aracı yalnızca iki tarafı buluşturur; veriler doğrudan ve şifreli gider. */
let pc, dc, polite = false, ready = false, makingOffer = false, closedByUs = false, broker = null, bconn = null;
const ICE = [{urls:'stun:stun.l.google.com:19302'}];
const PREFIX = 'esler-oi-26-';
const sig = o => ready ? send(o) : (bconn && bconn.open && bconn.send(o));

function newPeer() {
  pc = new RTCPeerConnection({iceServers: ICE});
  pc.onconnectionstatechange = onConnState;
  pc.oniceconnectionstatechange = () => { if (pc.iceConnectionState === 'failed') tryRestart(); };
  pc.onicecandidate = e => { if (e.candidate) sig({t:'ice', c:e.candidate.toJSON()}); };
  pc.onnegotiationneeded = renegotiate;
  pc.ontrack = onTrack;
  pc.ondatachannel = e => bindChannel(e.channel);
}
function bindBroker(c) {
  bconn = c;
  c.on('data', m => { if (m && (m.t === 'sdp' || m.t === 'ice')) onSignal(m); });
  c.on('error', e => st.msg('Bağlantı hatası: ' + e));
}
function hostRoom() {
  const code = String(Math.floor(100 + Math.random() * 900));
  broker = new Peer(PREFIX + code);
  broker.on('open', () => { $('#code').textContent = code; st.msg(''); });
  broker.on('error', e => {
    if (e.type === 'unavailable-id') { broker.destroy(); hostRoom(); }
    else st.msg(brokerErr(e));
  });
  broker.on('connection', c => {
    if (bconn) { c.on('open', () => c.close()); return; } // sadece ilk kişi
    polite = true; newPeer(); bindBroker(c); 
  });
}
function joinRoom(code) {
  broker = new Peer();
  broker.on('error', e => st.msg(e.type === 'peer-unavailable' ? 'Bu kodla açık oda yok. Kodu kontrol edin.' : brokerErr(e)));
  broker.on('open', () => {
    const c = broker.connect(PREFIX + code, {reliable:true}); bindBroker(c);
    c.on('open', async () => {
      polite = false; newPeer();
      bindChannel(pc.createDataChannel('esler', {ordered:true}));
      makingOffer = true; await pc.setLocalDescription(); makingOffer = false;
      sig({t:'sdp', d:pc.localDescription.toJSON()});
    });
  });
}
const brokerErr = e => e.type === 'network' || e.type === 'server-error' || e.type === 'socket-error'
  ? 'Buluşma sunucusuna ulaşılamadı. İnternet bağlantınızı kontrol edin.' : 'Hata: ' + (e.message || e.type);
function dropBroker() { try { broker && broker.destroy(); } catch {} broker = bconn = null; }

/* ---------- peer: yeniden müzakere (kamera/ekran sonradan eklenince) ---------- */
async function renegotiate() {
  if (!ready) return;
  try { makingOffer = true; await pc.setLocalDescription(); sig({t:'sdp', d:pc.localDescription.toJSON()}); }
  catch (e) { console.warn(e); } finally { makingOffer = false; }
}
async function onSignal(m) {
  if (!pc) return;
  if (m.t === 'ice') { try { await pc.addIceCandidate(m.c); } catch {} return; }
  const d = m.d, collision = d.type === 'offer' && (makingOffer || pc.signalingState !== 'stable');
  if (!polite && collision) return;
  await pc.setRemoteDescription(d);
  if (d.type === 'offer') { await pc.setLocalDescription(); sig({t:'sdp', d:pc.localDescription.toJSON()}); }
}
function tryRestart() {
  setStat('w', 'Yeniden bağlanıyor');
  if (!polite && ready && dc.readyState === 'open') pc.restartIce();
  setTimeout(() => { if (pc && pc.connectionState !== 'connected' && !closedByUs) {
    setStat('x', 'Koptu'); sys('Bağlantı koptu. Doğrudan bağlantı kurulamadıysa farklı bir ağ deneyin, sonra yeni kodla tekrar bağlanın.');
  }}, 12000);
}
function onConnState() {
  const s = pc.connectionState;
  if (s === 'connected') setStat('ok', 'Bağlı');
  else if (s === 'disconnected') tryRestart();
  else if (s === 'failed') tryRestart();
}

/* ---------- güvenlik kodu (DTLS parmak izlerinden) ---------- */
const EMO = ['🍎','🍌','🍇','🍉','🍒','🥝','🥕','🌽','🍄','🌵','🌲','🌻','🌙','⭐','🔥','💧','⚡','❄️','🌈','☂️','🎈','🎁','🎵','🎲','🚲','🚀','⛵','🚗','🏠','🔑','🔔','💡','📚','✏️','📌','🧲','🧭','⌛','🐶','🐱','🐭','🐰','🦊','🐻','🐼','🐨','🐯','🦁','🐮','🐷','🐸','🐵','🐔','🐧','🐦','🦉','🐢','🐍','🐙','🦀','🐟','🐬','🐳','🦋'];
async function safetyCode() {
  const fp = sdp => (sdp.match(/a=fingerprint:\S+ (\S+)/) || [])[1] || '';
  const a = [fp(pc.localDescription.sdp), fp(pc.remoteDescription.sdp)].sort().join('|');
  const h = new Uint8Array(await crypto.subtle.digest('SHA-256', enc.encode(a)));
  return [0,1,2,3].map(i => EMO[h[i] & 63]).join(' ');
}

/* ---------- chat: veri kanalı ---------- */
function bindChannel(ch) {
  dc = ch; dc.binaryType = 'arraybuffer'; dc.bufferedAmountLowThreshold = 1 << 20;
  dc.onopen = async () => {
    ready = true; show('s-sess'); setStat('ok', 'Bağlı'); setTimeout(dropBroker, 3000);
    $('#safety').textContent = await safetyCode();
    
  };
  dc.onclose = () => { ready = false; if (!closedByUs) { setStat('x','Koptu'); sys('Karşı taraf ayrıldı ya da bağlantı koptu.'); } };
  dc.onmessage = e => {
    if (typeof e.data !== 'string') return recvChunk(e.data);
    const m = JSON.parse(e.data);
    switch (m.t) {
      case 'text': bubble('th', m.v); $('#typing').textContent = ''; break;
      case 'typing': showTyping(); break;
      case 'sdp': case 'ice': onSignal(m); break;
      case 'file-meta': recvStart(m); break;
      case 'file-end': recvEnd(m); break;
      case 'cancel': recvCancel(m); break;
      case 'bye': closedByUs = true; setStat('x','Bitti'); sys('Karşı taraf bağlantıyı bitirdi.'); stopAll(); break;
    }
  };
}
const send = o => { if (dc && dc.readyState === 'open') dc.send(JSON.stringify(o)); };
function sendText() {
  const v = $('#tx').value.trim(); if (!v || !ready) return;
  send({t:'text', v}); bubble('me', v); $('#tx').value = '';
}
let typT = 0, lastTyp = 0;
function showTyping() { $('#typing').textContent = 'Karşı taraf yazıyor…'; clearTimeout(typT); typT = setTimeout(() => $('#typing').textContent = '', 2500); }

/* ---------- transfer: görseller parça parça ---------- */
const CH = 16384, queue = []; let sending = null, incoming = null;
function enqueue(files) {
  if (!ready) return;
  queue.push(...files);
  pump();
}
async function pump() {
  if (sending || !queue.length) return;
  const f = queue.shift(), id = Math.random().toString(36).slice(2);
  const ui = fileBubble('me', f.name, f.size, () => { sending.cancel = true; });
  if (f.type.startsWith('image/')) ui.setImg(URL.createObjectURL(f));
  sending = {id, cancel:false};
  send({t:'file-meta', id, name:f.name, size:f.size, mime:f.type || 'application/octet-stream'});
  const buf = await f.arrayBuffer();
  for (let o = 0; o < buf.byteLength; o += CH) {
    if (sending.cancel || !ready) { send({t:'cancel', id}); ui.done('İptal edildi'); sending = null; return pump(); }
    if (dc.bufferedAmount > 4 << 20) await new Promise(r => dc.addEventListener('bufferedamountlow', r, {once:true}));
    dc.send(buf.slice(o, o + CH));
    ui.prog((o + CH) / buf.byteLength);
  }
  send({t:'file-end', id}); ui.done('Gönderildi'); sending = null; pump();
}
function recvStart(m) {
  incoming = {...m, parts:[], got:0, ui: fileBubble('th', m.name, m.size)};
}
function recvChunk(d) {
  if (!incoming) return;
  incoming.parts.push(d); incoming.got += d.byteLength; incoming.ui.prog(incoming.got / incoming.size);
}
function recvEnd(m) {
  if (!incoming || incoming.id !== m.id) return;
  const url = URL.createObjectURL(new Blob(incoming.parts, {type: incoming.mime}));
  if (incoming.mime.startsWith('image/')) incoming.ui.setImg(url); incoming.ui.done('İndir', url, incoming.name); incoming = null;
}
function recvCancel(m) { if (incoming && incoming.id === m.id) { incoming.ui.done('Gönderen iptal etti'); incoming = null; } }

/* ---------- media: kamera ve ekran ---------- */
let camStream = null, scrStream = null, facing = 'user', remoteStream = null;
const senders = {video:null, audio:null};
function onTrack(e) {
  if (!remoteStream) { remoteStream = new MediaStream(); $('#rv').srcObject = remoteStream; }
  $('#rv').play().catch(() => $('#tap').hidden = false);
  remoteStream.addTrack(e.track);
  e.track.onunmute = updateVid; e.track.onended = updateVid; e.track.onmute = updateVid;
  updateVid();
}
function updateVid() {
  const rOn = remoteStream && remoteStream.getVideoTracks().some(t => t.readyState === 'live' && !t.muted);
  const lOn = !!(camStream || scrStream);
  $('#vid').classList.toggle('show', !!(rOn || lOn));
  $('#lv').classList.toggle('show', lOn);
}
function setSender(kind, track, stream) {
  if (senders[kind]) senders[kind].replaceTrack(track);
  else if (track) senders[kind] = pc.addTrack(track, stream);
}
async function toggleCam() {
  if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; if (!scrStream) setSender('video', null); setSender('audio', null); return mediaUi(); }
  try {
    camStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:facing, width:{ideal:1280}}, audio:true});
  } catch (e) { return mediaErr(e, 'Kamera'); }
  if (scrStream) stopScreen(true);
  setSender('video', camStream.getVideoTracks()[0], camStream);
  const a = camStream.getAudioTracks()[0]; if (a) setSender('audio', a, camStream);
  $('#lv').srcObject = camStream; mediaUi();
}
async function flipCam() {
  if (!camStream) return;
  facing = facing === 'user' ? 'environment' : 'user';
  try {
    const s = await navigator.mediaDevices.getUserMedia({video:{facingMode:facing}});
    const nt = s.getVideoTracks()[0], old = camStream.getVideoTracks()[0];
    camStream.removeTrack(old); old.stop(); camStream.addTrack(nt);
    setSender('video', nt); $('#lv').srcObject = camStream;
  } catch (e) { mediaErr(e, 'Kamera'); }
}
function toggleMic() {
  const a = camStream && camStream.getAudioTracks()[0]; if (!a) return;
  a.enabled = !a.enabled; mediaUi();
}
async function toggleScreen() {
  if (scrStream) return stopScreen();
  if (!navigator.mediaDevices.getDisplayMedia) return sys('Bu cihaz ekran paylaşımını desteklemiyor (çoğu telefonda yoktur).');
  try { scrStream = await navigator.mediaDevices.getDisplayMedia({video:true}); }
  catch (e) { return mediaErr(e, 'Ekran paylaşımı'); }
  const t = scrStream.getVideoTracks()[0]; t.onended = () => stopScreen();
  setSender('video', t, scrStream); $('#lv').srcObject = scrStream; mediaUi();
}
function stopScreen(silent) {
  if (!scrStream) return; scrStream.getTracks().forEach(t => t.stop()); scrStream = null;
  if (!silent) { if (camStream) { setSender('video', camStream.getVideoTracks()[0]); $('#lv').srcObject = camStream; } else setSender('video', null); }
  mediaUi();
}
function mediaErr(e, what) {
  if (location.protocol === 'file:' && e.name !== 'NotAllowedError') sys(what + ' başlatılamadı. Dosya bilgisayardan açıldığı için tarayıcı engelliyor olabilir; Chrome veya Edge kullanın.');
  else if (e.name === 'NotAllowedError') sys(what + ' izni reddedildi. Adres çubuğundaki kilit simgesinden izin verebilirsiniz.');
  else if (e.name === 'NotFoundError') sys('Bu cihazda kamera bulunamadı.');
  else sys(what + ' başlatılamadı: ' + e.message);
}
function mediaUi() {
  $('#b-cam').classList.toggle('on', !!camStream);
  $('#b-scr').classList.toggle('on', !!scrStream);
  const a = camStream && camStream.getAudioTracks()[0];
  $('#b-mic').disabled = !a; $('#b-mic').classList.toggle('on', !!(a && a.enabled));
  $('#b-flip').disabled = !camStream;
  updateVid();
}
function stopAll() {
  [camStream, scrStream].forEach(s => s && s.getTracks().forEach(t => t.stop()));
  camStream = scrStream = null; mediaUi();
}

/* ---------- ui ---------- */
function show(id) { document.querySelectorAll('.screen').forEach(s => s.classList.toggle('act', s.id === id)); }
function setStat(c, t) { $('#dot').className = 'dot ' + c; $('#stat').textContent = t; }
function scroll() { const l = $('#log'); l.scrollTop = l.scrollHeight; }
function bubble(who, text) { const d = document.createElement('div'); d.className = 'b ' + who; d.textContent = text; $('#log').append(d); scroll(); return d; }
const sys = t => bubble('sys', t);
const fmt = n => n > 1 << 20 ? (n / 1048576).toFixed(1) + ' MB' : Math.ceil(n / 1024) + ' KB';
function fileBubble(who, name, size, onCancel) {
  const d = bubble(who, ''), img = document.createElement('img'), cap = document.createElement('div'),
    pr = document.createElement('div'), act = document.createElement('div');
  img.hidden = true; cap.textContent = name + ' · ' + fmt(size); pr.className = 'prog'; pr.innerHTML = '<i></i>';
  d.append(img, cap, pr, act);
  if (onCancel) { const b = document.createElement('a'); b.href = '#'; b.textContent = 'İptal'; b.onclick = e => { e.preventDefault(); onCancel(); }; act.append(b); }
  return {
    setImg(u) { img.src = u; img.hidden = false; img.onload = scroll; },
    prog(p) { pr.firstChild.style.width = Math.min(100, p * 100).toFixed(0) + '%'; },
    done(label, url, fname) {
      pr.remove(); act.textContent = '';
      if (url) { const a = document.createElement('a'); a.href = url; a.download = fname; a.textContent = label; act.append(a); }
      else act.textContent = label;
    }
  };
}

/* kurulum sihirbazı */
const st = { msg(t, k='e') { const m = $('#st-msg'); m.textContent = t; m.className = 'msg ' + (t ? k : ''); },
  step(n) { document.querySelectorAll('.steps i').forEach((i, k) => i.classList.toggle('d', k < n)); } };
const html = s => { const t = document.createElement('template'); t.innerHTML = s.trim(); return t.content; };
function startCreate() {
  show('s-setup'); $('#st-title').textContent = 'Oda oluştur'; st.msg('Kod alınıyor…', 'i'); st.step(1);
  const b = $('#st-body'); b.textContent = '';
  b.append(html(`    <div id="code" class="mono" style="font-size:56px;letter-spacing:14px;text-align:center;color:var(--or)">···</div>`));
  hostRoom(); watchFail();
}
function startJoin() {
  show('s-setup'); $('#st-title').textContent = 'Odaya katıl'; st.msg(''); st.step(1);
  const b = $('#st-body'); b.textContent = '';
  b.append(html(`    <input id="jc" class="mono" inputmode="numeric" maxlength="3" placeholder="000" style="font-size:40px;letter-spacing:12px;text-align:center">`));
  const i = $('#jc'); i.focus();
  i.oninput = () => { i.value = i.value.replace(/\D/g, ''); if (i.value.length === 3) { i.disabled = true; st.step(2); st.msg(''); joinRoom(i.value); watchFail(); } };
}
function watchFail() {
  setTimeout(() => { if (!ready && pc && $('#s-setup').classList.contains('act')) st.msg('Doğrudan bağlantı kurulamadı. Farklı bir ağ deneyip (mesela biri mobil veri) baştan başlayın.'); }, 30000);
}
function resetPeer() { dropBroker(); closedByUs = true; try { pc && pc.close(); } catch {} pc = dc = null; ready = false; closedByUs = false; }

/* olaylar */
$('#b-create').onclick = startCreate;
$('#b-join').onclick = startJoin;
$('#b-back').onclick = () => { resetPeer(); show('s-home'); };
$('#b-send').onclick = sendText;
$('#tx').onkeydown = e => { if (e.key === 'Enter') sendText(); else if (Date.now() - lastTyp > 1500) { lastTyp = Date.now(); send({t:'typing'}); } };
$('#b-img').onclick = () => $('#file').click();
$('#file').onchange = e => { enqueue([...e.target.files]); e.target.value = ''; };
$('#b-cam').onclick = toggleCam; $('#b-mic').onclick = toggleMic; $('#b-flip').onclick = flipCam; $('#b-scr').onclick = toggleScreen;
$('#tap').onclick = () => { $('#rv').play(); $('#tap').hidden = true; };
$('#fs').onclick = () => { const v = $('#vid'), r = $('#rv'); if (document.fullscreenElement) return document.exitFullscreen(); const f = v.requestFullscreen || v.webkitRequestFullscreen; f ? f.call(v) : r.webkitEnterFullscreen && r.webkitEnterFullscreen(); };
$('#b-end').onclick = () => { if (!confirm('Bağlantı bitirilsin mi? Yazışmalar silinecek.')) return; send({t:'bye'}); stopAll(); resetPeer(); $('#log').textContent = ''; $('#safety').textContent = ''; remoteStream = null; senders.video = senders.audio = null; show('s-home'); };
addEventListener('beforeunload', () => send({t:'bye'}));
document.addEventListener('paste', e => { if (!ready) return; const f = [...e.clipboardData.files]; if (f.length) { e.preventDefault(); enqueue(f); } });
let dragN = 0;
addEventListener('dragenter', e => { if (ready && e.dataTransfer.types.includes('Files')) { dragN++; $('#drop').classList.add('show'); } });
addEventListener('dragleave', () => { if (--dragN <= 0) { dragN = 0; $('#drop').classList.remove('show'); } });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => { e.preventDefault(); dragN = 0; $('#drop').classList.remove('show'); if (ready) enqueue([...e.dataTransfer.files]); });
if (!window.Peer) document.querySelector('#s-home .card').prepend(html('<div class="msg e" style="display:block">Bağlantı bileşeni yüklenemedi. İnternet bağlantınızı kontrol edip sayfayı yenileyin.</div>'));
if (!window.RTCPeerConnection) document.querySelector('#s-home .card').prepend(html('<div class="msg e" style="display:block">Bu tarayıcı desteklenmiyor. Güncel Chrome, Edge, Firefox veya Safari kullanın.</div>'));
</script>
</body>
</html>
