<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>miyhav</title>
<link rel="icon" href="img/logo_simge.webp">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
<style>
html,body{margin:0;height:100%;background:#F4EFEA;overflow:hidden}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#app{width:390px;height:844px;transform-origin:center center;flex:none;box-shadow:0 10px 40px rgba(0,0,0,.12);border-radius:0;overflow:hidden;background:#fff}
@media (min-width:600px){#app{border-radius:36px}}
button,a{-webkit-tap-highlight-color:transparent}
</style>
</head>
<body>
<div id="wrap"><div id="app"></div></div>
<template id="tpl">
<div style="width: 390px; height: 844px; background: #FFFFFF; color: #1C1714; font-family: Nunito, sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">
<div style="padding: 44px 16px 0; height: 96px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; flex: none">
<div style="flex: 1; min-width: 0; display: flex; align-items: center">
<sc-if value="{{isHome}}" hint-placeholder-val="{{ true }}"><img src="img/logo_yatay.webp" alt="miyhav" style="height: 38px; width: auto; display: block"></sc-if>
<sc-if value="{{notHome}}" hint-placeholder-val="{{ false }}"><span style="font-family: Nunito, sans-serif; font-weight: 900; font-size: 26px; color: #1C1714">{{screenTitle}}</span></sc-if>
</div>
<button onClick="{{goShop}}" aria-label="Pati Puan" style="display: inline-flex; align-items: center; gap: 5px; height: 36px; padding: 0 12px 0 6px; border-radius: 999px; border: 0; cursor: pointer; background: #FFE4E6; color: #8E1B26; font: 900 15px Nunito, sans-serif"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#F0525E"></circle><circle cx="12" cy="12" r="7.5" fill="#D62F3C"></circle><g fill="#FFE3E5"><ellipse cx="12" cy="14" rx="3" ry="2.4"></ellipse><circle cx="8.6" cy="10.6" r="1.3"></circle><circle cx="11" cy="8.6" r="1.3"></circle><circle cx="13.4" cy="8.6" r="1.3"></circle><circle cx="15.6" cy="10.6" r="1.3"></circle></g></svg>{{pati}}</button>
<button onClick="{{goShop}}" aria-label="Mama Puan" style="display: inline-flex; align-items: center; gap: 5px; height: 36px; padding: 0 12px 0 6px; border-radius: 999px; border: 0; cursor: pointer; background: #FFF3CF; color: #5C4300; font: 900 15px Nunito, sans-serif"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#FFC23D"></circle><circle cx="12" cy="12" r="7.5" fill="#FFB000"></circle><g fill="#FFF4CC"><ellipse cx="12" cy="14" rx="3" ry="2.4"></ellipse><circle cx="8.6" cy="10.6" r="1.3"></circle><circle cx="11" cy="8.6" r="1.3"></circle><circle cx="13.4" cy="8.6" r="1.3"></circle><circle cx="15.6" cy="10.6" r="1.3"></circle></g></svg>{{coins}}</button>
<button onClick="{{toggleHelp}}" aria-label="Bu sayfa ne işe yarar?" style="width: 40px; height: 40px; border-radius: 999px; border: 0; background: #F6F1EC; color: #1C1714; font: 900 17px Nunito, sans-serif; cursor: pointer; flex: none">?</button>
</div>
<sc-if value="{{showModeRow}}" hint-placeholder-val="{{ true }}">
<div style="padding: 4px 16px 0; height: 44px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; flex: none">
<div role="tablist" style="flex: 1; display: flex; background: #F6F1EC; border-radius: 12px; padding: 3px; height: 36px; box-sizing: border-box">
<button onClick="{{toCat}}" style="flex: 1; border: 0; border-radius: 9px; font: 800 14px Nunito, sans-serif; cursor: pointer; {{catTab}}">Kediler</button>
<button onClick="{{toDog}}" style="flex: 1; border: 0; border-radius: 9px; font: 800 14px Nunito, sans-serif; cursor: pointer; {{dogTab}}">Köpekler</button>
</div>
</div>
</sc-if>
<sc-if value="{{noModeRow}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; top: 50px; right: 0; display: none"></div>
</sc-if>
<sc-if value="{{isRace}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; gap: 24px; padding: 6px 16px 0; border-bottom: 1px solid #EFE6DD; flex: none">
<button onClick="{{goDuel}}" style="border: 0; background: none; padding: 8px 0 10px; font: 900 15px Nunito, sans-serif; cursor: pointer; {{segDuel}}">Düello</button>
<button onClick="{{goSira}}" style="border: 0; background: none; padding: 8px 0 10px; font: 900 15px Nunito, sans-serif; cursor: pointer; {{segSira}}">Sıralama</button>
<button onClick="{{goOyun}}" style="border: 0; background: none; padding: 8px 0 10px; font: 900 15px Nunito, sans-serif; cursor: pointer; {{segOyun}}">Pati Koşusu</button>
</div>
</sc-if>
<div style="flex: 1; overflow-y: auto; overflow-x: hidden">
<sc-if value="{{isAkis}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; gap: 14px; overflow-x: auto; padding: 10px 16px 6px">
<sc-for list="{{stars}}" as="s" hint-placeholder-count="6">
<button onClick="{{s.open}}" aria-label="{{s.name}} profilini aç" style="border: 0; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; flex: none; width: 68px">
<div style="width: 68px; height: 68px; border-radius: 999px; padding: 3px; box-sizing: border-box; background: #FF6A2B"><div style="width: 62px; height: 62px; border-radius: 999px; border: 3px solid #FFFFFF; box-sizing: border-box; position: relative; overflow: hidden; background: #F6F1EC"><sc-if value="{{isCat}}"><img src="img/kedi_sprite.webp" alt="" style="position: absolute; width: 1000%; height: 500%; max-width: none; left: {{s.l}}; top: {{s.t}}"></sc-if><sc-if value="{{isDog}}"><img src="img/kopek_sprite.webp" alt="" style="position: absolute; width: 1000%; height: 500%; max-width: none; left: {{s.l}}; top: {{s.t}}"></sc-if></div></div>
<span style="font-size: 12px; font-weight: 800; color: #1C1714; max-width: 68px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{s.name}}</span>
</button>
</sc-for>
</div>
<div style="padding: 4px 16px 10px"><span style="display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: 999px; background: #DDF5F0; color: #0B5247; font-size: 12px; font-weight: 900"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path></svg><span>Bugün {{todayViews}} kişi senin patine baktı</span></span></div>
<sc-for list="{{chunks}}" as="ch" hint-placeholder-count="2">
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px">
<sc-for list="{{ch.items}}" as="item" hint-placeholder-count="12">
<button onClick="{{item.open}}" aria-label="{{item.name}} fotoğrafını aç" style="border: 0; padding: 0; position: relative; aspect-ratio: 1; overflow: hidden; background: #F6F1EC; cursor: pointer"><sc-if value="{{isCat}}"><img src="img/kedi_sprite.webp" alt="" style="position: absolute; width: 1000%; height: 500%; max-width: none; left: {{item.l}}; top: {{item.t}}"></sc-if><sc-if value="{{isDog}}"><img src="img/kopek_sprite.webp" alt="" style="position: absolute; width: 1000%; height: 500%; max-width: none; left: {{item.l}}; top: {{item.t}}"></sc-if>
<span style="position: absolute; left: 5px; right: 5px; bottom: 5px; display: flex; justify-content: space-between"><span style="display: inline-flex; align-items: center; gap: 3px; padding: 2px 7px; border-radius: 999px; background: rgba(20,14,10,.55); color: #FFFFFF; font-size: 11px; font-weight: 900"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path></svg>{{item.views}}</span><span style="display: inline-flex; align-items: center; gap: 3px; padding: 2px 7px; border-radius: 999px; background: rgba(20,14,10,.55); color: #FFFFFF; font-size: 11px; font-weight: 900"><svg width="12" height="12" viewBox="0 0 24 24" fill="#FF5A7A" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"></path></svg>{{item.hearts}}</span></span>
</button>
</sc-for>
</div>
<sc-if value="{{ch.ad}}" hint-placeholder-val="{{ true }}"><div style="margin: 2px 0; height: 250px; background: #F6F1EC; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #6B5E55"><span style="font-size: 10px; font-weight: 900; letter-spacing: .6px; padding: 2px 6px; border-radius: 6px; background: #EFE6DD">REKLAM</span><span style="font-family: Nunito, sans-serif; font-weight: 900; font-size: 15px">300×250 kare reklam alanı</span></div></sc-if>
</sc-for>
</sc-if>
<sc-if value="{{isFoto}}" hint-placeholder-val="{{ false }}">
<div style="position: relative; width: 390px; height: 390px; overflow: hidden; background: #F6F1EC"><sc-if value="{{isCat}}"><img src="img/kedi_sprite.webp" alt="" style="position: absolute; width: 1000%; height: 500%; max-width: none; left: {{sel.l}}; top: {{sel.t}}"></sc-if><sc-if value="{{isDog}}"><img src="img/kopek_sprite.webp" alt="" style="position: absolute; width: 1000%; height: 500%; max-width: none; left: {{sel.l}}; top: {{sel.t}}"></sc-if>
<button onClick="{{goAkis}}" aria-label="Geri" style="position: absolute; top: 12px; left: 12px; width: 44px; height: 44px; border-radius: 999px; border: 0; background: rgba(255,255,255,.9); cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1C1714" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
</div>
<div style="padding: 14px 16px 0; display: flex; align-items: center; gap: 8px">
<button onClick="{{sel.profile}}" style="border: 0; background: none; padding: 0; font-family: Nunito, sans-serif; font-weight: 900; font-size: 26px; color: #1C1714; cursor: pointer">{{sel.name}}</button>
<sc-for list="{{sel.badges}}" as="b" hint-placeholder-count="2"><button onClick="{{b.tap}}" aria-label="{{b.label}} başarımı" style="border: 0; padding: 0; background: none; cursor: pointer; flex: none"><span style="position: relative; display: block; width: 36px; height: 36px; overflow: hidden; border-radius: 999px; {{b.lockStyle}}"><img src="img/rozet_sprite2.webp" alt="" style="position: absolute; width: 500%; height: 500%; max-width: none; left: {{b.bl}}; top: {{b.bt}}"></span></button></sc-for>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 12px 16px 0; text-align: center">
<div style="padding: 10px 4px; border-radius: 14px; background: #F6F1EC"><div style="font-family: Nunito, sans-serif; font-weight: 900; font-size: 18px">{{sel.views}}</div><div style="font-size: 11px; font-weight: 800; color: #6B5E55">görüntülenme</div></div>
<div style="padding: 10px 4px; border-radius: 14px; background: #F6F1EC"><div style="font-family: Nunito, sans-serif; font-weight: 900; font-size: 18px">{{sel.visits}}</div><div style="font-size: 11px; font-weight: 800; color: #6B5E55">profil ziyareti</div></div>
<div style="padding: 10px 4px; border-radius: 14px; background: #F6F1EC"><div style="font-family: Nunito, sans-serif; font-weight: 900; font-size: 18px">#{{sel.rank}}</div><div style="font-size: 11px; font-weight: 800; color: #6B5E55">haftalık sıra</div></div>
</div>
<div style="display: flex; gap: 8px; overflow-x: auto; padding: 14px 16px 2px">
<sc-for list="{{reactions}}" as="r" hint-placeholder-count="6">
<button onClick="{{r.tap}}" aria-label="{{r.label}} tepkisi ver" style="flex: none; min-height: 44px; padding: 0 14px; border-radius: 999px; border: 0; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font: 900 14px Nunito, sans-serif; color: #1C1714; {{r.style}}"><span style="font-size: 20px">{{r.e}}</span>{{r.n}}</button>
</sc-for>
</div>
<div style="padding: 8px 16px 0; font-size: 13px; font-weight: 700; color: #6B5E55">Bugün {{sel.today}} kişi bu fotoğrafa bastı</div>
<div style="display: flex; gap: 8px; padding: 14px 16px 20px">
<button onClick="{{shareWa}}" style="flex: 1; min-height: 48px; border: 0; border-radius: 14px; background: #1E7A45; color: #FFFFFF; font: 900 14px Nunito, sans-serif; cursor: pointer">WhatsApp'ta paylaş</button>
<button onClick="{{shareIg}}" style="flex: 1; min-height: 48px; border: 0; border-radius: 14px; background: #C13584; color: #FFFFFF; font: 900 14px Nunito, sans-serif; cursor: pointer">Instagram'da paylaş</button>
</div>
</sc-if>
<sc-if value="{{isDuello}}" hint-placeholder-val="{{ false }}">
<div style="padding: 12px 16px 10px; display: flex; align-items: center; gap: 10px">
<div style="flex: 1"><div style="font-family: Nunito, sans-serif; font-weight: 900; font-size: 21px">Hangisi daha tatlı?</div><div style="font-size: 12px; font-weight: 800; color: #6B5E55">{{duelHint}}</div></div>
<span style="display: inline-flex; align-items: center; height: 30px; padding: 0 12px; border-radius: 999px; background: #DDF5F0; color: #0B5247; font-size: 13px; font-weight: 900">{{votes}} / 15 oy</span>
</div>
<sc-if value="{{hasVotes}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 4px; position: relative">
<button onClick="{{voteA}}" aria-label="{{a.name}} için oy ver" style="border: 0; padding: 0; position: relative; height: 250px; overflow: hidden; background: #F6F1EC; cursor: pointer; display: block; width: 100%"><sc-if value="{{isCat}}"><img src="img/kedi_sprite.webp" alt="" style="position: absolute; width: 3900px; height: 1950px; max-width: none; left: {{a.pl}}; top: {{a.pt}}"></sc-if><sc-if value="{{isDog}}"><img src="img/kopek_sprite.webp" alt="" style="position: absolute; width: 3900px; height: 1950px; max-width: none; left: {{a.pl}}; top: {{a.pt}}"></sc-if><span style="position: absolute; left: 12px; bottom: 12px; padding: 6px 14px; border-radius: 999px; background: rgba(255,255,255,.94); font: 900 15px Nunito, sans-serif; color: #1C1714">{{a.name}}</span></button>
<div style="position: absolute; left: 50%; top: 252px; transform: translate(-50%, -50%); z-index: 2; width: 72px; height: 72px; border-radius: 999px; padding: 6px; box-sizing: border-box; border: 4px solid #FFFFFF; background: conic-gradient(#12A28C {{ringDeg}}deg, #E9E1DA 0deg); display: flex; box-shadow: 0 6px 16px rgba(0,0,0,.18)"><div style="flex: 1; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-family: Nunito, sans-serif; font-weight: 900; font-size: 17px; {{vsStyle}}">VS</div></div>
<button onClick="{{voteB}}" aria-label="{{b.name}} için oy ver" style="border: 0; padding: 0; position: relative; height: 250px; overflow: hidden; background: #F6F1EC; cursor: pointer; display: block; width: 100%"><sc-if value="{{isCat}}"><img src="img/kedi_sprite.webp" alt="" style="position: absolute; width: 3900px; height: 1950px; max-width: none; left: {{b.pl}}; top: {{b.pt}}"></sc-if><sc-if value="{{isDog}}"><img src="img/kopek_sprite.webp" alt="" style="position: absolute; width: 3900px; height: 1950px; max-width: none; left: {{b.pl}}; top: {{b.pt}}"></sc-if><span style="position: absolute; left: 12px; bottom: 12px; padding: 6px 14px; border-radius: 999px; background: rgba(255,255,255,.94); font: 900 15px Nunito, sans-serif; color: #1C1714">{{b.name}}</span></button>
</div>
</sc-if>
<sc-if value="{{noVotes}}" hint-placeholder-val="{{ false }}">
<div style="margin: 8px 16px; padding: 24px 18px; border-radius: 24px; background: #F6F1EC; text-align: center">
<img src="img/tac_ikili.webp" alt="" style="width: 190px; height: auto">
<div style="font-family: Nunito, sans-serif; font-weight: 900; font-size: 22px; margin-top: 8px">Patiler biraz dinleniyor</div>
<div style="font-size: 14px; font-weight: 700; color: #4A3F38; line-height: 1.45; margin-top: 6px">Bu turun oy hakların bitti. 12 dakikada 1 yeni hak dolar, 3 saatte hepsi yenilenir.</div>
<div style="margin-top: 14px"><button onClick="{{goOdul}}" style="width: 100%; min-height: 52px; border: 0; border-radius: 16px; font: 900 16px Nunito, sans-serif; cursor: pointer; background: #1C1714; color: #FFFFFF">Sandıklara bak</button></div>
</div>
</sc-if>
<div style="padding: 16px 16px 20px">
<div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 900"><span>Seviye {{level}} · {{levelName}}</span><span style="color: #6B5E55">{{xpIn}} / 100 XP</span></div>
<div style="height: 10px; border-radius: 99px; background: #F6F1EC; margin-top: 6px; overflow: hidden"><div style="height: 100%; border-radius: 99px; background: #12A28C; width: {{xpPct}}"></div></div>
</div>
</sc-if>
<sc-if value="{{isSira}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: flex-end; justify-content: center; gap: 10px; padding: 22px 16px 0">
<sc-for list="{{podium}}" as="p" hint-placeholder-count="3">
<button onClick="{{p.open}}" aria-label="{{p.name}} profilini aç" style="border: 0; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer">
<div style="position: relative; overflow: hidden; border-radius: 999px; box-sizing: border-box; {{p.ring}}"><sc-if value="{{isCat}}"><img src="img/kedi_sprite.webp" alt="" style="position: absolute; width: 1000%; height: 500%; max-width: none; left: {{p.l}}; top: {{p.t}}"></sc-if><sc-if value="{{isDog}}"><img src="img/kopek_sprite.webp" alt="" style="position: absolute; width: 1000%; height: 500%; max-width: none; left: {{p.l}}; top: {{p.t}}"></sc-if></div>
<span style="font-family: Nunito, sans-serif; font-weight: 900; font-size: 15px; color: #1C1714">{{p.name}}</span>
<span style="display: flex; align-items: center; justify-content: center; border-radius: 16px 16px 0 0; width: 104px; font-family: Nunito, sans-serif; font-weight: 900; font-size: 26px; {{p.block}}">{{p.place}}</span>
</button>
</sc-for>
</div>
<div style="margin: 0 16px; padding: 12px 14px; border-radius: 0 0 16px 16px; background: #FFE8DC; color: #8A2E05; font-size: 13px; font-weight: 900; text-align: center">Sen 14. sıradasın · 3. olmak için 86 kalp daha</div>
<div style="display: flex; flex-direction: column; padding: 8px 16px 20px">
<sc-for list="{{rest}}" as="r" hint-placeholder-count="6">
<button onClick="{{r.open}}" style="border: 0; border-bottom: 1px solid #EFE6DD; background: #FFFFFF; padding: 8px 0; display: flex; align-items: center; gap: 12px; cursor: pointer; text-align: left; font-family: Nunito, sans-serif">
<span style="width: 24px; font-family: Nunito, sans-serif; font-weight: 900; font-size: 15px; color: #6B5E55">{{r.place}}</span>
<div style="width: 48px; height: 48px; border-radius: 999px; position: relative; overflow: hidden; flex: none; background: #F6F1EC"><sc-if value="{{isCat}}"><img src="img/kedi_sprite.webp" alt="" style="position: absolute; width: 1000%; height: 500%; max-width: none; left: {{r.l}}; top: {{r.t}}"></sc-if><sc-if value="{{isDog}}"><img src="img/kopek_sprite.webp" alt="" style="position: absolute; width: 1000%; height: 500%; max-width: none; left: {{r.l}}; top: {{r.t}}"></sc-if></div>
<span style="flex: 1; font-size: 15px; font-weight: 900; color: #1C1714">{{r.name}}</span>
<span style="display: inline-flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 900; color: #1C1714"><svg width="12" height="12" viewBox="0 0 24 24" fill="#FF5A7A" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"></path></svg>{{r.hearts}}</span>
</button>
</sc-for>
</div>
</sc-if>
<sc-if value="{{isOyun}}" hint-placeholder-val="{{ false }}">
<div style="margin: 14px 16px 0; border-radius: 24px; background: #FF6A2B; overflow: hidden; position: relative; padding: 18px 16px 16px">
<div style="display: flex; align-items: center; gap: 12px">
<div style="flex: 1"><div style="font-family: Nunito, sans-serif; font-weight: 900; font-size: 26px; color: #1C1714; line-height: 1.05">Pati Koşusu</div><div style="font-size: 13px; font-weight: 800; color: #3A1A08; margin-top: 4px">Zıpla, eğil, mama ve kalp topla.</div>
<div style="display: inline-flex; margin-top: 8px; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,.9); color: #1C1714; font-size: 12px; font-weight: 900">Bugün {{plays}} / 3 koşu hakkı</div></div>
<img src="img/tac_ikili.webp" alt="" style="width: 132px; height: auto; flex: none; background: #FFFFFF; border-radius: 18px; padding: 4px">
</div>
<div style="margin-top: 14px">
<sc-if value="{{canPlay}}" hint-placeholder-val="{{ true }}"><a href="https://ozanirmak.github.io/patikosusu/" target="_blank" onClick="{{play}}" style="display: flex; align-items: center; justify-content: center; min-height: 54px; border-radius: 16px; background: #1C1714; color: #FFFFFF; font: 900 17px Nunito, sans-serif; text-decoration: none; box-shadow: 0 4px 0 #000000">Koşmaya başla</a></sc-if>
<sc-if value="{{noPlays}}" hint-placeholder-val="{{ false }}"><div style="padding: 14px; border-radius: 16px; background: rgba(255,255,255,.9); text-align: center; font-size: 14px; font-weight: 800; color: #4A3F38">Bugünkü 3 koşunu yaptın. Yeni haklar gece yarısı.</div></sc-if>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding: 10px 16px 0">

<script>
class DCLogic{constructor(p){this.props=p||{};this.state={};this._q=false}
 setState(o){this.state=Object.assign({},this.state,o);if(!this._q){this._q=true;requestAnimationFrame(()=>{this._q=false;render()})}}}

class Component extends DCLogic {
  componentDidMount() {
    if (this.props.screen === 'duello') this.setState({ readyAt: Date.now() + 3000 });
    this._r = setInterval(() => { const x = this.state || {}; const sc = x.screen ?? this.props.screen; if (sc === 'duello' && x.readyAt && Date.now() < x.readyAt + 150) this.setState({ tick: Date.now() }); }, 100);
    if ((this.props.screen ?? 'akis') === 'akis' && this.props.intro !== false) {
      this._s = setTimeout(() => this.setState({ splashDone: true }), 2200);
      this._p = setInterval(() => { const x = this.state || {}; if ((x.welcomeDone || x.tutDone) && (x.guide ?? 0) < 4) this.setState({ pulse: !x.pulse }); }, 700);
    }
  }
  componentWillUnmount() { clearTimeout(this._s); clearTimeout(this._t); clearInterval(this._p); clearInterval(this._r); }
  renderVals() {
    const st = this.state || {};
    const set = (o) => this.setState(o);
    const startScreen = this.props.screen ?? 'akis';
    const screen = st.screen ?? (startScreen === 'splash' ? 'akis' : startScreen);
    const introOn = startScreen === 'splash' || (startScreen === 'akis' && this.props.intro !== false);
    const showSplash = startScreen === 'splash' || (introOn && !st.splashDone);
    const tutStep = st.tut ?? 0;
    const mode = st.mode ?? this.props.mode ?? 'kedi';
    const isCat = mode === 'kedi';
    const CAT = ['Pamuk','Tarçın','Duman','Minnoş','Boncuk','Zeytin','Fındık','Lokum','Şeker','Mırnav','Karamel','Bal','Paşa','Gece','Kömür','Sütlaç','Tekir','Maviş','Cimcime','Pofuduk','Limon','Nohut','Badem','Kestane','Leblebi','Mia','Luna','Simba','Oscar','Leo','Bulut','Kurabiye','Zuzu','Pıtırcık','Prenses','Mantı','Pisi','Susam','Haydut','Cesur','Ponçik','Elma','Mocha','Kiki','Lili','Tombi','Gölge','Yumoş','Çiko','Tontiş'];
    const DOG = ['Karabaş','Çomar','Fıstık','Bulut','Zeus','Lucky','Maya','Badem','Kurabiye','Max','Rocky','Bella','Daisy','Cookie','Toprak','Duman','Aslan','Kont','Lord','Hera','Lessie','Pamuk','Sarıkız','Odin','Thor','Bobi','Rex','Ares','Mocha','Bal','Tarçın','Cesur','Dost','Yumak','Panda','Benekli','Kahve','Zeytin','Leo','Luna','Şans','Kuki','Pati','Oreo','Bıdık','Tosun','Kara','Sultan','Efe','Paşa'];
    const names = isCat ? CAT : DOG;
    const fmt = (n) => n >= 1000 ? (Math.round(n / 100) / 10).toString().replace('.', ',') + 'B' : String(n);
    const seed = (i, k) => { const x = Math.sin((i + 1) * (isCat ? 12.9898 : 78.233) * k) * 43758.5453; return x - Math.floor(x); };
    const T = { b: ['Bronz', 'background: #FBE2D3; box-shadow: inset 0 0 0 3px #D9895B', 'background: #FBE2D3; color: #7A3A14', 31], g: ['Gümüş', 'background: #EEF0F4; box-shadow: inset 0 0 0 3px #9AA3B2', 'background: #EEF0F4; color: #3E4654', 14], a: ['Altın', 'background: #FFE7A3; box-shadow: inset 0 0 0 3px #F2B731', 'background: #FFE7A3; color: #5C4300', 5], e: ['Efsane', 'background: #E6E0FF; box-shadow: inset 0 0 0 3px #7C5CFF', 'background: #E6E0FF; color: #3B2A8A', 1] };
    const ACH = [
      ['🐾','İlk Pati','İlk fotoğrafını yükledi.','b'],['📸','Albüm Sahibi','Profiline 4 fotoğraf ekledi.','b'],['👑','Haftanın Yıldızı','Haftalık sıralamada 1. oldu.','a'],['🥉','Podyum','Haftalık sıralamada ilk 3e girdi.','g'],
      ['💖','Kalp Mıknatısı','Toplam 1.000 kalp topladı.','g'],['💘','Kalp Fırtınası','Bir günde 100 kalp aldı.','g'],['👀','Göz Bebeği','Fotoğrafları 10.000 kez görüntülendi.','g'],['⭐','Ünlü Pati','Profili 1.000 kez ziyaret edildi.','a'],
      ['🫶','Hayran Kulübü','100 hayran topladı.','g'],['🔥','Ateşli Seri','7 gün üst üste uygulamaya girdi.','b'],['💎','Demir İrade','30 gün üst üste uygulamaya girdi.','a'],['⚔️','Düello Ustası','500 düelloda oy verdi.','g'],
      ['🛡️','Yenilmez','Bir fotoğrafı arka arkaya 10 düello kazandı.','a'],['⚡','Kombo Kralı','25 oyluk düello kombosu yaptı.','g'],['⚖️','Jüri Üyesi','Toplam 1.000 oy verdi.','a'],['😻','Tepki Ustası','500 emoji tepkisi bıraktı.','b'],
      ['🌹','Mahalle Gülü','Mahallesinde haftanın en çok kalp alan patisi oldu.','g'],['🦸','Sokak Kahramanı','Bir sokak dostunu sahiplendi ya da profilini yönetip haftada 3 kez mama götürdü.','a'],['🌅','Erken Kuş','Haftalık yarışmaya ilk saatte katıldı.','b'],['🏆','Efsane','Seviye 10a ulaştı.','e'],['📣','Sosyal Pati','Miyhavı WhatsApp ya da Instagramda paylaştı.','g']
    ].map(([icon, label, how, t], k) => ({ k, icon, label, how: how.replace('3e', "3'e").replace('10a', "10'a").replace('Miyhavı', "Miyhav'ı").replace('Instagramda', "Instagram'da"), style: T[t][1], tier: T[t][0] + ' başarım', tierStyle: T[t][2], pct: T[t][3], date: (3 + k) + ' Kasım 2026', bl: '-' + (k % 5) * 100 + '%', bt: '-' + Math.floor(k / 5) * 100 + '%', tap: () => set({ badge: k, fromGallery: false }) }));
    const earned = [0, 1, 4, 9, 11, 15, 18].concat((this.state || {}).shared ? [20] : []);
    const data = names.map((nm, i) => {
      const views = Math.floor(400 + seed(i, 1) * 9000);
      const hearts = Math.floor(views * (0.12 + seed(i, 2) * 0.2));
      const n = 2 + Math.floor(seed(i, 3) * 3);
      const badges = Array.from({ length: n }, (_, q) => ACH[Math.floor(seed(i, 4 + q) * 20)]).filter((x, q, arr) => arr.indexOf(x) === q);
      return { i, name: nm, views, hearts, badges, l: '-' + (i % 10) * 100 + '%', t: '-' + Math.floor(i / 10) * 100 + '%', pl: '-' + (i % 10) * 390 + 'px', pt: '-' + (Math.floor(i / 10) * 390 + 64) + 'px' };
    });
    const pack = (d) => ({ ...d, views: fmt(d.views), hearts: fmt(d.hearts), open: () => set({ screen: 'foto', sel: d.i, showHelp: false }), profile: () => set({ screen: 'profil', sel: d.i, showHelp: false }) });
    const list = data.map(pack);
    const ranked = [...data].sort((a, b) => b.hearts - a.hearts);
    const selI = st.sel ?? 0;
    const sd = data[selI];
    const toast = (msg) => { set({ toast: msg }); clearTimeout(this._t); this._t = setTimeout(() => this.setState({ toast: '' }), 1600); };
    const rx = st.rx || {};
    const EMO = [['❤️','Kalp'],['😍','Bayıldım'],['😻','Tatlış'],['🐾','Pati'],['🏆','Şampiyon'],['🔥','Ateş']];
    const reactions = EMO.map(([e, label], k) => {
      const key = selI + '-' + k;
      const base = Math.floor(sd.hearts * [1, 0.4, 0.3, 0.2, 0.08, 0.15][k]);
      const mine = !!rx[key];
      return { e, label, n: fmt(base + (mine ? 1 : 0)), style: mine ? 'background: #FFE1D2; box-shadow: inset 0 0 0 2px #F26A2E' : 'background: #F4EFEA', tap: () => { set({ rx: { ...rx, [key]: !mine }, xp: (st.xp ?? 640) + (mine ? 0 : 2) }); if (!mine) toast(e + ' gönderildi · +2 XP'); } };

      achAll: ACH.map((x) => ({ ...x, lockStyle: earned.includes(x.k) ? '' : 'filter: grayscale(1); opacity: .4', tap: () => set({ badge: x.k, fromGallery: true }) })), earnedCount: earned.length, closeBadge: () => set({ badge: null }),
      hasToast: !!st.toast, toast: st.toast || ''
    };
  }
}

const params=new URLSearchParams(location.search);
const comp=new Component({screen:params.get('ekran')||'akis',mode:params.get('tur')||'kedi',intro:params.get('intro')==='0'?false:undefined});
const tpl=document.getElementById('tpl').content;const app=document.getElementById('app');
function look(path,scope){path=path.trim();if(path==='true')return true;if(path==='false')return false;if(/^-?\d+(\.\d+)?$/.test(path))return +path;
 const parts=path.split('.');for(let i=scope.length-1;i>=0;i--){if(parts[0] in scope[i]){let v=scope[i][parts[0]];for(let k=1;k<parts.length&&v!=null;k++)v=v[parts[k]];return v}}return undefined}
const WHOLE=/^\s*\{\{([^}]+)\}\}\s*$/;
function interp(str,scope){return str.replace(/\{\{([^}]+)\}\}/g,(m,p)=>{const v=look(p,scope);return v==null?'':v})}
function build(node,scope,parent){
 if(node.nodeType===3){parent.appendChild(document.createTextNode(interp(node.nodeValue,scope)));return}
 if(node.nodeType!==1)return;
 const tag=node.tagName.toLowerCase();
 if(tag==='sc-if'){const m=WHOLE.exec(node.getAttribute('value')||'');if(m&&look(m[1],scope))node.childNodes.forEach(c=>build(c,scope,parent));return}
 if(tag==='sc-for'){const m=WHOLE.exec(node.getAttribute('list')||'');const list=(m&&look(m[1],scope))||[];const as=node.getAttribute('as')||'item';
  list.forEach((it,i)=>{const sc=scope.concat([{[as]:it,$index:i}]);node.childNodes.forEach(c=>build(c,sc,parent))});return}
 const SVGNS='http://www.w3.org/2000/svg';const el=(node.namespaceURI===SVGNS||tag==='svg'||(parent.namespaceURI===SVGNS))?document.createElementNS(SVGNS,tag==='svg'?'svg':node.localName):document.createElement(tag);
 for(const a of node.attributes){const n=a.name;if(n.startsWith('hint-'))continue;
  if(/^on[a-z]/i.test(n)){const m=WHOLE.exec(a.value);const fn=m&&look(m[1],scope);if(typeof fn==='function')el.addEventListener(n.slice(2).toLowerCase(),e=>{fn(e)});continue}
  el.setAttribute(n,interp(a.value,scope))}
 node.childNodes.forEach(c=>build(c,scope,el));parent.appendChild(el)}
let lastScr;function render(){const sc=app.querySelector('[style*="overflow-y: auto"]');let top=sc?sc.scrollTop:0;const scr=comp.state.screen;if(scr!==lastScr){top=0;lastScr=scr}
 const vals=comp.renderVals();const frag=document.createDocumentFragment();tpl.childNodes.forEach(c=>build(c,[vals],frag));app.replaceChildren(frag);
 const sc2=app.querySelector('[style*="overflow-y: auto"]');if(sc2)sc2.scrollTop=top}
function fit(){const s=Math.min(innerWidth/390,innerHeight/844);app.style.transform='scale('+s+')'}
addEventListener('resize',fit);fit();render();if(comp.componentDidMount)comp.componentDidMount();
</script>
